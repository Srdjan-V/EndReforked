org.gradle.configuration-cache = true
org.gradle.jvmargs = -Xmx3G

# This project retains its GPLv2 license; do not validate it against the
# CleanroomMC visible-source license used by the conventions plugin.
conventions.license = none

# Cleanroom (https://github.com/CleanroomMC/CleanroomModTemplate)
cleanroom_version = 0.7.14-alpha

modId = endreborn
modName = EndReforked
modGroup = io.github.srdjanv.endreforked
modVersion = 1.0.0
minecraftUsername = Developer

# Mixin refmap, generated by CleanroomGradle. Must match "refmap" in mixins.endreborn*.json
cg.userdev.refmap = mixins.endreborn.refmap.json
coreModClass = io.github.srdjanv.endreforked.core.EndReForgedPlugin

# The Kotlin runtime comes from the Forgelin-Continuous mod, not from the mod jar
kotlin.stdlib.default.dependency = false
wireVersion = 7.1.2

# Optional script engines. Compile-only in :server, dev runs only in :mod, never in the jar
groovyScriptVersion = 1.5.0
# CraftTweaker2 1.12-4.1.20.718, CurseForge file id (the CurseForge jar contains the API and ZenScript, the Maven main jar does not)
craftTweakerFileId = 9357132
