import java.util.stream.Collectors

plugins {
    id 'java'
    id 'com.cleanroommc.cleanroomgradle'
}

group = modGroup
version = modVersion

base {
    archivesName = 'EndReforked'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

repositories {
    exclusiveContent {
        forRepository { maven { name 'CurseMaven'; url 'https://curse.cleanroommc.com' } }
        filter { includeGroup 'curse.maven' }
    }
    exclusiveContent {
        forRepository { maven { name 'Modrinth'; url 'https://api.modrinth.com/maven' } }
        filter { includeGroup 'maven.modrinth' }
    }
    exclusiveContent {
        forRepository { maven { name 'CleanroomMC'; url 'https://maven.cleanroommc.com' } }
        filter { includeGroup 'mezz' }
    }
    maven { name 'BlameJared'; url 'https://maven.blamejared.com' }
    maven { name 'GTNH'; url 'https://nexus.gtnewhorizons.com/repository/public/' }
}

// JER or TiC bring in the old JEI 4.16 transitively, which clashes with HEI/JEI 4.36
configurations.configureEach { exclude group: 'mezz.jei' }

def modularUI = '2.4.3'
def netherAPI = '1.3.0'

dependencies {
    implementation cleanroom.userdev(cleanroom_version)

    compileOnly 'zone.rong:mixinbooter:9.1'
    compileOnly 'org.jetbrains:annotations:24.1.0'
    // Only for the @Desugar annotation used in the sources. Jabel is not applied (Java 25 target).
    compileOnly 'com.github.bsideup.jabel:jabel-javac-plugin:1.0.0'

    implementation 'mezz:jei:4.36.1:dev'

    implementation deobf('curse.maven:baubles-227083:2518667')
    implementation deobf('curse.maven:tinkersconstruct-74072:2902483')
    implementation deobf('curse.maven:mantle-74924:2713386')
    implementation "com.cleanroommc:modularui:${modularUI}"
    implementation deobf("maven.modrinth:nether-api:${netherAPI}")
    implementation deobf('curse.maven:just_enough_resources-240630:2728586')

    // Dropped: CodeChickenLib, Redstone Flux, CoFH Core/World, Thermal Expansion/Foundation/Dynamics.
    // No source uses them, and CCL 3.2.3 crashes in the Cleanroom dev env (see report).
}

// A fixed UUID avoids the Mojang name lookup of CleanroomGradle, which fails on a non-JSON reply
def devUuid = UUID.nameUUIDFromBytes("OfflinePlayer:${minecraftUsername}".getBytes('UTF-8')).toString()
cleanroom {
    runs {
        client {
            configure {
                username = minecraftUsername
                getUUID().set(devUuid)
                jvmArgs "-Dfml.coreMods.load=${coreModClass}"
            }
        }
        server {
            configure {
                getUUID().set(devUuid)
                jvmArgs "-Dfml.coreMods.load=${coreModClass}"
            }
        }
    }
}

// Generates io.github.srdjanv.endreforked.Tags
def tags = [
        MODID            : "\"${modId}\"",
        MODNAME          : "\"${modName}\"",
        VERSION          : "\"${modVersion}\"",
        MOD_DEPS         : "\"required-after:modularui@[${modularUI},);required-after:nether_api@[${netherAPI},)\"",
        MOD_PREFIX       : "\"${modId}:\"",
        DATAFIXER_VERSION: '1',
        CLIENTPROXY      : "\"${modGroup}.client.ClientProxy\"",
        COMMONPROXY      : "\"${modGroup}.common.CommonProxy\"",
        ISSUES_URL       : '"https://github.com/Srdjan-V/EndReforked/issues"',
]
def tagsDir = layout.buildDirectory.dir('generated/tags')
def tagsPackage = modGroup
def generateTags = tasks.register('generateTags') {
    inputs.property('tags', tags)
    outputs.dir(tagsDir)
    doLast {
        def f = tagsDir.get().file(tagsPackage.replace('.', '/') + '/Tags.java').asFile
        f.parentFile.mkdirs()
        def fields = tags.collect { k, v -> "    public static final ${v.startsWith('"') ? 'String' : 'int'} ${k} = ${v};" }
        f.text = "package ${tagsPackage};\n\npublic final class Tags {\n\n${fields.join('\n')}\n\n    private Tags() {}\n}\n"
    }
}
sourceSets.main.java.srcDir(generateTags.map { tagsDir })

jar {
    manifest {
        attributes(
                'FMLCorePlugin': coreModClass,
                'FMLCorePluginContainsFMLMod': true,
                'ForceLoadAsMod': true)
    }
}

// Taken from CleanroomModTemplate (marked there as a Foundation issue). Without it, mods on the dev
// classpath are loaded by the app class loader and fail (SidedProxy is null, coremods cannot be cast).
tasks.withType(JavaExec).configureEach {
    systemProperty 'foundation.loadsall', 'true'
}
