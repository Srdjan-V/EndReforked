syntax = "proto3";

package io.github.srdjanv.endreforked.wire.s2c;

option java_package = "io.github.srdjanv.endreforked.wire.s2c";

// Server to client envelope. The oneof case is the message type.
message S2CPacket {
  oneof payload {
    PlayerParticle player_particle = 1;
    TpParticle tp_particle = 2;
    RegistrySnapshot registry_snapshot = 3;
  }
}

// Starts or stops a particle effect on the local player. The other fields are only used when remove is false.
message PlayerParticle {
  bool remove = 1;
  string id = 2;
  int32 render_iterations = 3;
  int32 particle_type = 4; // EnumParticleTypes id
}

// Portal particle trail between two positions.
message TpParticle {
  double pos_x = 1;
  double pos_y = 2;
  double pos_z = 3;
  double new_pos_x = 4;
  double new_pos_y = 5;
  double new_pos_z = 6;
  double width = 7;
  double height = 8;
}

// The complete content of one registry. The server sends one per registry on login and after a reload.
// The client replaces its registry with it. A new registry adds one case to the oneof.
message RegistrySnapshot {
  string registry = 1; // registry id, for example endreborn:machine_recipes
  oneof entries {
    MachineRecipes machine_recipes = 2;
    WandConversions wand_conversions = 3;
    FluidBlockInteractions fluid_block_interactions = 4;
    FluidEntityInteractions fluid_entity_interactions = 5;
  }
}

message MachineRecipes {
  repeated MachineRecipe recipes = 1;
}

message MachineRecipe {
  string id = 1;
  string machine = 2;
  repeated Ingredient item_inputs = 3;
  repeated FluidAmount fluid_inputs = 4;
  repeated ItemResult item_outputs = 5;
  repeated FluidAmount fluid_outputs = 6;
  int32 ticks = 7;
  int32 entropy = 8;
  int32 priority = 9;
  repeated WorldEvent world_events = 10;
}

message Ingredient {
  oneof kind {
    ItemIngredient item = 1;
    OreIngredient ore = 2;
  }
}

message ItemIngredient {
  string id = 1;
  int32 meta = 2; // 32767 matches every meta
  int32 count = 3;
}

message OreIngredient {
  string name = 1;
  int32 count = 2;
}

message ItemResult {
  string id = 1;
  int32 meta = 2;
  int32 count = 3;
}

// A fluid id with an amount in mB. Used for fluid inputs and outputs.
message FluidAmount {
  string id = 1;
  int32 amount = 2;
}

// A world event of a machine recipe, see api WorldEvent.
message WorldEvent {
  int32 at_percent = 1;
  int32 chance = 2;
  StructureSpec structure = 3;
  WorldAction action = 4;
}

message StructureSpec {
  repeated Aisle aisles = 1;
  repeated SymbolSpec symbols = 2;
}

message Aisle {
  repeated string rows = 1;
}

message SymbolSpec {
  string symbol = 1; // exactly one character
  BlockSpec block = 2;
}

message BlockSpec {
  string block = 1;
  map<string, string> properties = 2;
}

message WorldAction {
  oneof kind {
    SetBlockAction set_block = 1;
    DropItemAction drop_item = 2;
  }
}

message SetBlockAction {
  BlockSpec block = 1;
}

message DropItemAction {
  ItemResult item = 1;
}

// World interaction registries, see api WorldInteraction.kt.
message WandConversions {
  repeated WandConversion conversions = 1;
}

message WandConversion {
  string id = 1;
  BlockSpec match = 2;
  BlockSpec result = 3;
  optional int32 item_damage = 4; // not set: the server config value
  int32 priority = 5;
  repeated WorldEffect effects = 6;
}

enum WorldEffect {
  WORLD_EFFECT_UNKNOWN = 0;
  FLINT_SOUND = 1;
}

message FluidBlockInteractions {
  repeated FluidBlockInteraction interactions = 1;
}

message FluidBlockInteraction {
  string id = 1;
  string fluid = 2;
  BlockSpec match = 3;
  BlockSpec result = 4;
  int32 chance = 5;
  bool consume_source = 6;
  int32 consume_chance = 7;
  int32 priority = 8;
}

message FluidEntityInteractions {
  repeated FluidEntityInteraction interactions = 1;
}

message FluidEntityInteraction {
  string id = 1;
  string fluid = 2;
  string entity = 3;
  ItemIngredient item = 4; // only for minecraft:item
  bool remove_entity = 5;
  EntityResult result = 6;
  int32 chance = 7;
  bool consume_source = 8;
  int32 consume_chance = 9;
  int32 priority = 10;
}

message EntityResult {
  oneof kind {
    ItemResult spawn_item = 1;
    string spawn_entity = 2;
    BlockSpec set_fluid_block = 3;
  }
}
